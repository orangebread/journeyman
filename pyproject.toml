[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "journeyman"
version = "0.1.0"
description = "Skill-owned statechart design workflow support tools"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
journeyman = "journeyman.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
