id: background-export-happy
title: Background Export Happy Path
actors:
  - user
  - application
  - export worker
states:
  - id: report_open
    entry_condition: User is viewing a report page.
  - id: export_requested
    entry_condition: User has requested an export.
  - id: job_queued
    entry_condition: Application has accepted and queued the export job.
  - id: export_generating
    entry_condition: Export worker is generating the CSV.
  - id: file_stored
    entry_condition: Generated CSV is stored for download.
  - id: user_notified
    entry_condition: User has been notified that the export is ready.
  - id: file_downloaded
    entry_condition: User has downloaded the generated CSV.
initial: report_open
transitions:
  - id: T-001
    from: report_open
    to: export_requested
    trigger: User selects export from the report page.
    expected_result: Application records the export request.
  - id: T-002
    from: export_requested
    to: job_queued
    trigger: Application submits the export job to the queue.
    expected_result: Export job is queued for background processing.
  - id: T-003
    from: job_queued
    to: export_generating
    trigger: Export worker picks up the queued job.
    expected_result: CSV generation starts in the background.
  - id: T-004
    from: export_generating
    to: file_stored
    trigger: CSV generation completes and worker stores the file.
    expected_result: Stored file is available for download.
  - id: T-005
    from: file_stored
    to: user_notified
    trigger: Application sends export-ready notification.
    expected_result: User is notified that the export can be downloaded.
  - id: T-006
    from: user_notified
    to: file_downloaded
    trigger: User opens the ready export and downloads the file.
    expected_result: CSV file is downloaded.
terminal_states:
  - file_downloaded
metadata:
  source_requirements:
    - REQ-001
    - REQ-002
    - REQ-003
    - REQ-004
    - REQ-005
