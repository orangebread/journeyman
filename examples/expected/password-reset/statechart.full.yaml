id: password-reset-full
title: Password Reset Full Review Chart
actors:
  - user
  - authentication system
  - email delivery service
states:
  - id: at_login
    entry_condition: User is on the login screen and cannot remember the password.
    lane: user
  - id: reset_requested
    entry_condition: User has chosen the password reset path.
    lane: user
  - id: email_submitted
    entry_condition: User has submitted an email address.
    lane: authentication system
  - id: reset_link_delivered
    entry_condition: The reset link is available to the user.
    lane: email delivery service
  - id: reset_link_opened
    entry_condition: User has opened the reset link.
    lane: user
  - id: password_changed
    entry_condition: User has chosen and submitted a new password.
    lane: authentication system
  - id: ready_to_sign_in
    entry_condition: Password reset is complete and user can return to sign in.
    lane: user
  - id: email_format_needs_correction
    entry_condition: Submitted email does not meet input format rules.
    lane: user
  - id: reset_request_acknowledged
    entry_condition: The request has been acknowledged without revealing account existence.
    lane: authentication system
initial: at_login
transitions:
  - id: T-001
    from: at_login
    to: reset_requested
    trigger: User selects forgot-password from the login screen.
    expected_result: Password reset request form is shown.
    actor: user
  - id: T-002
    from: reset_requested
    to: email_submitted
    trigger: User enters email address and submits the form.
    expected_result: Authentication system accepts the request without revealing account existence.
    actor: user
  - id: T-003
    from: email_submitted
    to: reset_link_delivered
    trigger: Authentication system sends reset-link message.
    expected_result: User receives reset-link access for the happy path.
    actor: authentication system
    handoff_ref: HND-001
  - id: T-004
    from: reset_link_delivered
    to: reset_link_opened
    trigger: User opens the reset link.
    expected_result: Password reset form is available.
    actor: user
  - id: T-005
    from: reset_link_opened
    to: password_changed
    trigger: User submits a new password.
    expected_result: Authentication system updates the password.
    actor: user
  - id: T-006
    from: password_changed
    to: ready_to_sign_in
    trigger: Password change succeeds.
    expected_result: User is directed back to sign in.
    actor: authentication system
  - id: T-007
    from: reset_requested
    to: email_format_needs_correction
    trigger: User submits an invalid email format.
    expected_result: User remains in the reset request stage and can correct input.
    actor: user
    scenario_refs:
      - SCN-001
  - id: T-008
    from: email_submitted
    to: reset_request_acknowledged
    trigger: Submitted email is not recognized.
    expected_result: System acknowledges the request without revealing account existence.
    actor: authentication system
    scenario_refs:
      - SCN-002
  - id: T-009
    from: email_submitted
    to: reset_request_acknowledged
    trigger: Email delivery service is unavailable.
    expected_result: Request is acknowledged while retry and delivery guarantees remain accepted risk.
    actor: authentication system
    handoff_ref: HND-001
    scenario_refs:
      - SCN-003
  - id: T-010
    from: email_format_needs_correction
    to: reset_requested
    trigger: User edits the email field.
    expected_result: User can resubmit the reset request.
    actor: user
terminal_states:
  - ready_to_sign_in
  - reset_request_acknowledged
metadata:
  source_requirements:
    - REQ-001
    - REQ-002
    - REQ-003
    - REQ-004
    - REQ-005
  scenario_refs:
    - SCN-001
    - SCN-002
    - SCN-003
  lanes:
    - user
    - authentication system
    - email delivery service
  event_passes:
    - id: EVT-001
      from: authentication system
      to: email delivery service
      event: send reset-link email
      transition_ref: T-003
