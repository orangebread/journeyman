source_summary: A user needs a successful password reset journey from login screen through return to sign in.
request_type: stateful workflow
recommended_artifact: statechart
recommendation_confidence: high
clarification_budget: 3
scope_fence:
  primary_actor: user
  start_trigger: User selects password reset from the login screen.
  terminal_outcome: User has changed the password and is ready to sign in.
  non_goals:
    - Failed or expired reset links
    - Rate limiting
    - Email provider retry behavior
  external_systems:
    - email delivery service
    - password reset token service
  success_criteria:
    - User can request a reset link.
    - User can open the reset link.
    - User can choose a new password.
    - User returns to sign in after reset.
  failure_definition: The happy path fails if the user cannot progress from request to ready-to-sign-in.
